[workspace]
resolver = "2"
members = [
    "crates/aura_sample",
    "crates/aura_sequencing",
    "crates/aura_composition",
    "crates/aura_scheduler",
    "crates/aura_instrumentation",
    "crates/aura_imp",
    "crates/aura_imp_lab_catalogs",
    "crates/aura_imp_lab_playback",
    "crates/aura_dsp",
    "crates/aura_render",
    "crates/aura_plugin_host",
    "crates/aura_clap",
    "crates/aura_clap_fixture",
    "crates/aura_io_wav",
    "crates/aura_io_cpal",
    "crates/aura_io_midi",
    "crates/aura_integration",
    "crates/aura_cli",
]
# Imp and tome-rust-server crates are sibling checkouts (../imp-rs, ../tome-rust-server)
# with their own workspaces; they are path dependencies, not members (as in Imp Lab).

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/silentorb/aura-engine"

[workspace.dependencies]
imp_core_types = { path = "../imp-rs/crates/imp_core_types" }
imp_registry = { path = "../imp-rs/crates/imp_registry" }
imp_typecheck = { path = "../imp-rs/crates/imp_typecheck" }
imp_file = { path = "../imp-rs/crates/imp_file" }
imp_graph_resolve = { path = "../imp-rs/crates/imp_graph_resolve" }
imp_collection_transforms = { path = "../imp-rs/crates/imp_collection_transforms" }
imp_mir = { path = "../tome-rust-server/crates/imp_mir" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dasp_sample = "0.11"
dasp_signal = "0.11"
cpal = "0.18"
midir = "0.11"
thiserror = "2"
tempfile = "3"
base64 = "0.23"
clack-host = "0.2"
clack-plugin = "0.2"
clack-extensions = "0.2"
winit = "0.30"
