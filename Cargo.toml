[workspace]
resolver = "2"
members = [
    "crates/aura_sample",
    "crates/aura_sequencing",
    "crates/aura_composition",
    "crates/aura_scheduler",
    "crates/aura_instrumentation",
    "crates/aura_imp",
    "crates/aura_dsp",
    "crates/aura_render",
    "crates/aura_io_wav",
    "crates/aura_io_cpal",
    "crates/aura_integration",
    "crates/aura_cli",
    ".mnt/imp-rust/crates/imp_core_types",
    ".mnt/imp-rust/crates/imp_registry",
    ".mnt/imp-rust/crates/imp_typecheck",
    ".mnt/imp-rust/crates/imp_graph_library",
    ".mnt/imp-rust/crates/imp_graph_resolve",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/silentorb/aura-engine"

[workspace.dependencies]
imp_core_types = { path = ".mnt/imp-rust/crates/imp_core_types" }
imp_registry = { path = ".mnt/imp-rust/crates/imp_registry" }
imp_typecheck = { path = ".mnt/imp-rust/crates/imp_typecheck" }
imp_graph_library = { path = ".mnt/imp-rust/crates/imp_graph_library" }
imp_graph_resolve = { path = ".mnt/imp-rust/crates/imp_graph_resolve" }
imp_collection_transforms = { path = ".mnt/imp-rust/crates/imp_collection_transforms" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dasp_sample = "0.11"
dasp_signal = "0.11"
cpal = "0.18"
thiserror = "2"
tempfile = "3"
